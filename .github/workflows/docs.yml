name: website

# build the documentation whenever a release is published
on:
  release:
    types: [published]
  # Build (but do not deploy) on pull requests that could break it, so a
  # release is not the first time the documentation is generated.
  pull_request:
    paths:
      - 'redlines/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  # Lets the build be exercised without cutting a release.
  workflow_dispatch:

# security: restrict permissions for CI jobs.
permissions:
  contents: read

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project
        run: uv sync --all-extras --dev
      # The API documentation is generated into site/, which is not part of the
      # repository. docs/ holds hand-written documents (ADRs, the PRD) and is
      # left alone.
      - run: uv run pdoc -o site/ redlines
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    # A pull request only proves the build works; publishing stays on release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
