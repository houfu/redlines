# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  # Only main: work on a branch is covered by its pull request, so pushing to a
  # branch with an open PR would otherwise run the whole matrix twice.
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '*.png'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '*.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# A new push to the same branch makes the run in progress redundant. Grouping
# by branch name rather than github.ref keeps a pull_request run and a push run
# for one branch in the same group. Runs on main are left to finish, so every
# commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project (with nupunkt for Python 3.11+)
        if: ${{ matrix.python-version != '3.10' }}
        run: uv sync --all-extras --dev
      - name: Install the project (without nupunkt for Python 3.10)
        if: ${{ matrix.python-version == '3.10' }}
        run: uv sync --dev
      - name: Type check with mypy
        run: |
          uv run mypy redlines tests
      - name: Test with pytest
        run: |
          uv run pytest
