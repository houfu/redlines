# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  # Only main: work on a branch is covered by its pull request, so pushing to a
  # branch with an open PR would otherwise run the whole matrix twice.
  push:
    branches: [ main ]
    paths-ignore:
      # '*.md' and not '**.md': the latter matches test fixtures, so editing
      # tests/corpus/**/*.md alone would not run the suite.
      - '*.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE.txt'
      - '*.png'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      # '*.md' and not '**.md': the latter matches test fixtures, so editing
      # tests/corpus/**/*.md alone would not run the suite.
      - '*.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE.txt'
      - '*.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# A new push to the same branch makes the run in progress redundant. Grouping
# by branch name rather than github.ref keeps a pull_request run and a push run
# for one branch in the same group. Runs on main are left to finish, so every
# commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project (with nupunkt for Python 3.11+)
        if: ${{ matrix.python-version != '3.10' }}
        run: uv sync --all-extras --dev
      - name: Install the project (without nupunkt for Python 3.10)
        if: ${{ matrix.python-version == '3.10' }}
        run: uv sync --dev
      - name: Type check with mypy
        run: |
          uv run mypy redlines tests benchmark
      - name: Test with pytest
        run: |
          uv run pytest

  pyodide:
    # Blocking: the wheel must import under Pyodide (WASM CPython) so that
    # nothing in the browser-facing surface grows a dependency the browser
    # cannot load (ADR-0019, PRD N5, issue #109).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pyodide npm package (pinned)
        working-directory: .github/scripts
        run: npm ci
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Import redlines under Pyodide
        run: node .github/scripts/pyodide_check.mjs dist/redlines-*.whl

  # The 0.6.2 compatibility contract (ADR-0003), checked from outside this
  # repository's own tests. The pristine `tests/` and `examples/` trees of the
  # v0.6.2 tag are extracted from git, not from the working tree, and run
  # against the code as it stands, with every extra installed. Passing them
  # unmodified is a hard release criterion for 1.0.
  # `tests/test_v062_contract_frozen.py` proves that this repository's copies of
  # those files have not been edited; this job proves that the behaviour they
  # describe has not changed.
  #
  # Python 3.12, because nupunkt needs 3.11 or later. The archive is extracted
  # outside the checkout, so pytest's rootdir lands there and the repository's
  # own pytest configuration is not loaded: the old tests run as they did in
  # 0.6.2. It shares this workflow's triggers (and so its `paths-ignore`).
  #
  # It only blocks a merge once it is a required status check. That is a
  # repository setting, not workflow code: houfu can make `compat-v062`
  # required under the branch protection (or ruleset) settings when ready.
  compat-v062:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # `git archive v0.6.2` needs the tag, and a shallow clone has none.
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project (with nupunkt and the other extras)
        run: uv sync --all-extras --dev
      - name: Extract the pristine v0.6.2 tests and examples
        run: |
          mkdir -p "$RUNNER_TEMP/v062"
          git archive v0.6.2 tests examples | tar -x -C "$RUNNER_TEMP/v062"
      - name: Run them against the current code
        run: uv run pytest "$RUNNER_TEMP/v062/tests" -p no:cacheprovider
