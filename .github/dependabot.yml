# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # The workflow actions went four majors out of date before anyone noticed.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # ADR-0026 accepted a JavaScript dependency surface for the documentation
  # site. This is the mitigation.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      site-dependencies:
        patterns:
          - "*"
