[project]
name = "redlines"
version = "0.6.2"
description = "Compare text, and produce human-readable differences or deltas which look like track changes in Microsoft Word."
readme = "README.md"
authors = [
    { name = "houfu", email = "houfu@outlook.sg" }
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
keywords = ["diff", "text-comparison", "track-changes", "redlines", "document-comparison", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "click>=8.1.7",
    "click-default-group>=1.2.4",
    "rich-click>=1.6.1",
    "rich>=13.3.5",
    "PyYAML>=6.0.1",
    "typing-extensions>=4.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://houfu.github.io/redlines/"
Documentation = "https://houfu.github.io/redlines/"
Repository = "https://github.com/houfu/redlines"
"Agent Guide" = "https://houfu.github.io/redlines/guides/agent-guide/"

[project.optional-dependencies]
nupunkt = [
    "nupunkt>=0.6.0; python_version>='3.11'",
]
levenshtein = ["Levenshtein>=0.27.1"]
fuzzy = ["rapidfuzz>=3.0"]
pdf = ["pdfplumber>=0.10.0"]

[project.scripts]
redlines = 'redlines.cli:cli'

[dependency-groups]
dev = [
    "jsonschema>=4.0",
    "mypy>=1.14.1",
    "pdoc>=14.1.0",
    "pytest>=7.4.2",
    "pytest-cov>=3.0.0",
    "pytest-sugar>=0.9.7",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# The benchmark (ADR-0034) is a top-level, unpackaged `benchmark/` directory, so
# `import benchmark...` from a test needs the repository root on the path. `tests/`
# has no `__init__.py`, so pytest prepends `tests/` rather than the root.
pythonpath = ["."]
markers = [
    "slow: a test that measures something rather than asserting it quickly (N2)",
]


[tool.mypy]
python_version = "3.11"
strict = true
disable_error_code = ["misc", "unused-ignore"]

ignore_missing_imports = false
follow_untyped_imports = true

implicit_optional = true
strict_optional = true

show_error_context = true
show_error_code_links = true
pretty = true

[[tool.mypy.overrides]]
module = "nupunkt"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "Levenshtein"
ignore_missing_imports = true

# The `[fuzzy]` extra is absent from the Python 3.10 job and from the plain
# wheel the Pyodide job builds; `redlines/similarity.py` guards the import.
[[tool.mypy.overrides]]
module = ["rapidfuzz", "rapidfuzz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "click_default_group"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfplumber"
ignore_missing_imports = true
