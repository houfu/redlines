  - {document: cross-references, plan: renumber-storm}
  - {document: cross-references, plan: mixed}
  # mixed-labels
  - {document: mixed-labels, plan: light}
  - {document: mixed-labels, plan: mixed}
  # adr-moves
  - {document: adr-moves, plan: move-heavy}
  - {document: adr-moves, plan: mixed}
